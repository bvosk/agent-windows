[tools]
dotnet = "10"
hyperfine = "latest"

[settings]
quiet = true
unix_default_file_shell_args = "bash"
unix_default_inline_shell_args = "bash -c"
windows_default_file_shell_args = "bash"
windows_default_inline_shell_args = "bash -c"

[tasks.setup]
description = "Bootstrap repo (install tools, restore dotnet tools, install git hooks)"
run = '''
set -e
mise install
# Go through `mise exec` so this works on the very first run: the task's PATH is
# resolved before `mise install` above has installed dotnet.
echo "dotnet: $(mise exec -- dotnet --version)"
mise exec -- dotnet tool restore
mise exec -- dotnet husky install
echo "Setup complete!"
'''

[tasks.build]
description = "Build the solution (warnings are errors)"
run = "dotnet build AgentWindows.slnx"

[tasks.test]
description = "Run all tests"
run = "dotnet test AgentWindows.slnx"

[tasks.e2e]
description = "Run end-to-end tests: the real CLI drives the bundled WPF target app"
run = '''
set -e
dotnet build AgentWindows.slnx
AGENT_WINDOWS_E2E=1 dotnet test tests/AgentWindows.E2e.Tests --no-build
'''

[tasks.bench]
description = "Run the quick paired performance harness"
depends = ["perf"]

[tasks.perf]
description = "Run a quick local performance smoke suite"
run = '''
set -e
dotnet build AgentWindows.slnx -c Release
CLI=src/AgentWindows.Cli/bin/Release/net10.0-windows/agent-windows.exe
TARGET=tests/AgentWindows.E2eTarget/bin/Release/net10.0-windows/AgentWindows.E2eTarget.exe
dotnet run --project benchmarks/AgentWindows.Performance -c Release --no-build -- \
  --candidate "$CLI" --target "$TARGET" --output artifacts/performance/local --quick
'''

[tasks."perf:compare"]
description = "Compare this build with PERF_REFERENCE on the same machine"
run = '''
set -e
: "${PERF_REFERENCE:?Set PERF_REFERENCE to the reference agent-windows.exe}"
dotnet build AgentWindows.slnx -c Release
CLI=src/AgentWindows.Cli/bin/Release/net10.0-windows/agent-windows.exe
TARGET=tests/AgentWindows.E2eTarget/bin/Release/net10.0-windows/AgentWindows.E2eTarget.exe
dotnet run --project benchmarks/AgentWindows.Performance -c Release --no-build -- \
  --candidate "$CLI" --reference "$PERF_REFERENCE" --target "$TARGET" \
  --candidate-sha "$(git rev-parse HEAD)" --reference-sha "${PERF_REFERENCE_SHA:-baseline-v1}" \
  --output artifacts/performance/compare
'''

[tasks."perf:record"]
description = "Run the full authoritative performance suite"
run = '''
set -e
: "${PERF_REFERENCE:?Set PERF_REFERENCE to the reference agent-windows.exe}"
dotnet build AgentWindows.slnx -c Release
CLI=src/AgentWindows.Cli/bin/Release/net10.0-windows/agent-windows.exe
TARGET=tests/AgentWindows.E2eTarget/bin/Release/net10.0-windows/AgentWindows.E2eTarget.exe
dotnet run --project benchmarks/AgentWindows.Performance -c Release --no-build -- \
  --candidate "$CLI" --reference "$PERF_REFERENCE" --target "$TARGET" \
  --candidate-sha "$(git rev-parse HEAD)" --reference-sha "${PERF_REFERENCE_SHA:-baseline-v1}" \
  --context "${PERF_CONTEXT:-local}" --output artifacts/performance/record
'''

[tasks."perf:test"]
description = "Test per-commit discovery, deduplication, and matrix batching"
run = "pwsh -NoProfile -File scripts/performance/Test-CommitMatrix.ps1"

[tasks.profile]
description = "Capture a dotnet-trace of the daemon while it serves 30 interactive snapshots"
run = '''
set -e
dotnet build AgentWindows.slnx -c Release
CLI=src/AgentWindows.Cli/bin/Release/net10.0-windows/agent-windows.exe
TARGET=tests/AgentWindows.E2eTarget/bin/Release/net10.0-windows/AgentWindows.E2eTarget.exe
SESSION="profile-$$"
cleanup() {
  "$CLI" close --force --session "$SESSION" >/dev/null 2>&1 || true
  "$CLI" daemon stop --session "$SESSION" >/dev/null 2>&1 || true
}
trap cleanup EXIT
"$CLI" launch --app "$TARGET" --session "$SESSION"
PID=$("$CLI" status --session "$SESSION" | grep -oE "daemon: pid [0-9]+" | grep -oE "[0-9]+")
mkdir -p artifacts/profile
dotnet dotnet-trace collect -p "$PID" -o artifacts/profile/daemon.nettrace --duration 00:00:20 &
TRACE=$!
sleep 2
for i in $(seq 1 30); do "$CLI" snapshot -i --session "$SESSION" >/dev/null; done
wait $TRACE
echo "Trace written to artifacts/profile/daemon.nettrace"
echo "View with: dotnet dotnet-trace convert artifacts/profile/daemon.nettrace --format speedscope"
'''

[tasks.coverage]
description = "Run tests and require 100% line, branch, method, and full-method coverage"
run = '''
set -e
rm -rf artifacts/coverage-raw artifacts/coverage
dotnet test AgentWindows.slnx -- --coverlet --results-directory ./artifacts/coverage-raw
dotnet reportgenerator "-reports:artifacts/coverage-raw/coverage.cobertura.*.xml" "-targetdir:artifacts/coverage" "-reporttypes:Html;TextSummary;Cobertura" "minimumCoverageThresholds:lineCoverage=100" "minimumCoverageThresholds:branchCoverage=100" "minimumCoverageThresholds:methodCoverage=100" "minimumCoverageThresholds:fullMethodCoverage=100"
cat artifacts/coverage/Summary.txt
'''

[tasks.check]
description = "Run formatting, analyzer, test, and coverage quality gates"
run = '''
set -e
mise run format:check
mise run build
mise run coverage
'''

[tasks.format]
description = "Format all C# code with CSharpier"
run = "dotnet csharpier format ."

[tasks."format:check"]
description = "Verify formatting without changing files"
run = "dotnet csharpier check ."

[tasks.lint]
description = "Formatting check plus analyzer-enforced build"
depends = ["format:check", "build"]

[tasks.doctor]
description = "Validate local toolchain for contributors and agents"
run = '''
set -e
echo "mise: $(mise --version)"
if ! command -v dotnet >/dev/null 2>&1; then
  echo "dotnet is not installed via mise. Run: mise install"
  exit 1
fi
echo "dotnet path: $(command -v dotnet)"
echo "dotnet version: $(dotnet --version)"
'''

[tasks.publish]
description = "Publish self-contained single-file exe and the dotnet tool package"
run = '''
set -e
rm -rf artifacts/publish artifacts/daemon artifacts/tool-payload artifacts/package
dotnet publish src/AgentWindows.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o artifacts/daemon
dotnet publish src/AgentWindows.Client -c Release -r win-x64 -o artifacts/publish
mv artifacts/daemon/agent-windows.exe artifacts/publish/agent-windows-daemon.exe
dotnet publish src/AgentWindows.Cli -c Release -o artifacts/tool-payload
dotnet pack src/AgentWindows.Tool -c Release -o artifacts/package
'''

[tasks.reinstall]
description = "Publish and replace the globally installed agent-windows tool"
run = '''
set -e
mise run publish
CLI=artifacts/publish/agent-windows.exe
"$CLI" daemon stop --all
dotnet tool uninstall --global AgentWindows >/dev/null 2>&1 || true
dotnet tool install --global AgentWindows --add-source "$(pwd)/artifacts/package" --no-cache
EXPECTED=$("$CLI" --version)
ACTUAL=$(agent-windows --version)
if [ "$ACTUAL" != "$EXPECTED" ]; then
  echo "Installed version mismatch: expected $EXPECTED, got $ACTUAL"
  exit 1
fi
echo "Installed agent-windows $ACTUAL"
'''
