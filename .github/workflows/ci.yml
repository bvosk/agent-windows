name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.0
          cache: true

      - name: Restore repository tools
        run: mise run setup:ci

      - name: Full quality gate
        run: mise run check:full

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.0
          cache: true

      - name: End-to-end tests
        run: mise run e2e

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-diagnostics
          path: artifacts/test-diagnostics
          if-no-files-found: ignore
